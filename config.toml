# butter-agent default config.
#
# An empty document is valid — every section below shows the defaults
# applied when omitted. Edit a value to override it; delete a section to
# fall back to defaults.

[core]
# Invariant #7 ceiling. A plugin whose manifest declares a broader radius
# than this is rejected at registry build time. Valid tiers (broadest last):
#   read-only       no side effects
#   local-write     local filesystem / local DB writes
#   network         outbound network requests
max_blast_radius = "network"

# Future-facing hook: hosts a `network` plugin may reach. Empty means
# "no restriction beyond the radius itself" — the plugin source-fetch
# module will enforce this once it lands.
network_allowlist = []

# Capability discovery (specs/development/capability-discovery.md). When
# true, the planner is shown a compact plugin index and selects the
# plugin(s) it needs before being given their capability schemas —
# removing the keyword filter's top-8 truncation and registration-order
# blindspot at the cost of one extra model round-trip per turn. Off by
# default so it can be A/B'd on local models; the keyword filter remains
# the implementation when this is false.
capability_discovery = false

# Skip-when-trivial cut-off for the above. When discovery is on but the
# registry exposes this many or fewer user-facing capabilities, the whole
# menu already fits without truncation, so the extra round-trip is skipped
# and the keyword path runs instead. Default mirrors the keyword filter's
# top_k (8): at or below it nothing is truncated anyway.
discovery_capability_threshold = 8

[model]
# Local-first default per scope. Ollama with Qwen3 8B; swap provider for
# anything that implements the ModelClient protocol.
provider = "ollama"
model = "qwen3:8b"
host = "http://localhost:11434"
# Per-call timeout in seconds. 60 suits warm requests; bump it (e.g. 180)
# if you regularly cold-load larger models over LAN.
timeout_seconds = 60
# Chain-of-thought emission for CoT models (qwen3, deepseek-r1, etc).
# Off by default: the planning loop calls the model twice per turn
# (intent + synthesis) and CoT pays its cost on each call. Set true
# only if a specific model produces noticeably worse plans without it.
think = false

[storage]
# Local SQLite by default. Path is expanded by the storage provider at
# startup — `~` is left as-is here.
provider = "sqlite"
path = "~/.butter-agent/butter.db"

# External plugin sources. butter-agent ships no opinionated capability
# bundled — only the internal `database` infra plugin is built in. Notes,
# clock, etc. are standalone repos you opt into here. Each [[plugin]]
# entry requires a pinned ref — branch refs (main/master/HEAD) are
# rejected at parse time — or a local `path` for development.
#
# [[plugin]]
# source = "github.com/sgrech/butter-plugin-notes@v0.3.0"
#
# [[plugin]]
# source = "github.com/sgrech/butter-plugin-clock@v0.2.0"
#
# A plugin entry may carry an optional `config` inline table — operator
# settings surfaced read-only to that one plugin via PluginContext.config
# (the model never sees it). The filesystem plugin uses it to gate
# destructive operations: without `allow_delete = true` its `delete`
# capability is disabled; recursive directory deletion additionally
# requires `allow_recursive_delete = true`.
# [[plugin]]
# source = "github.com/sgrech/butter-plugin-filesystem@v0.1.0"
# config = { allow_delete = false, allow_recursive_delete = false }
#
# Local dev (used as-is, no fetch):
# [[plugin]]
# path = "~/Workspace/butter-plugin-notes"
#
# [[plugin]]
# path = "~/Workspace/butter-plugin-filesystem"
# config = { allow_delete = true }
