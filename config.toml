# butter-agent default config.
#
# An empty document is valid — every section below shows the defaults
# applied when omitted. Edit a value to override it; delete a section to
# fall back to defaults.

[core]
# Invariant #7 ceiling. A plugin whose manifest declares a broader radius
# than this is rejected at registry build time. Valid tiers (broadest last):
#   read-only       no side effects
#   local-write     local filesystem / local DB writes
#   network         outbound network requests
max_blast_radius = "network"

# Future-facing hook: hosts a `network` plugin may reach. Empty means
# "no restriction beyond the radius itself" — the plugin source-fetch
# module will enforce this once it lands.
network_allowlist = []

[model]
# Local-first default per scope. Ollama with Qwen3 8B; swap provider for
# anything that implements the ModelClient protocol.
provider = "ollama"
model = "qwen3:8b"
host = "http://localhost:11434"
# Per-call timeout in seconds. 60 suits warm requests; bump it (e.g. 180)
# if you regularly cold-load larger models over LAN.
timeout_seconds = 60
# Chain-of-thought emission for CoT models (qwen3, deepseek-r1, etc).
# Off by default: the planning loop calls the model twice per turn
# (intent + synthesis) and CoT pays its cost on each call. Set true
# only if a specific model produces noticeably worse plans without it.
think = false

[storage]
# Local SQLite by default. Path is expanded by the storage provider at
# startup — `~` is left as-is here.
provider = "sqlite"
path = "~/.butter-agent/butter.db"

# External plugin sources. butter-agent ships no opinionated capability
# bundled — only the internal `database` infra plugin is built in. Notes,
# clock, etc. are standalone repos you opt into here. Each [[plugin]]
# entry requires a pinned ref — branch refs (main/master/HEAD) are
# rejected at parse time — or a local `path` for development.
#
# [[plugin]]
# source = "github.com/sgrech/butter-plugin-notes@v0.1.0"
#
# [[plugin]]
# source = "github.com/sgrech/butter-plugin-clock@v0.1.0"
#
# Local dev (used as-is, no fetch):
# [[plugin]]
# path = "~/Workspace/butter-plugin-notes"
