[project]
name = 'butter-agent'
version = '0.0.1'
description = 'Local-first open-source conversational agent runtime. I pass butter.'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
authors = [{ name = 'Shane Grech' }]
dependencies = [
    "prompt-toolkit>=3.0.52",
]

[project.scripts]
butter = 'butter_agent.cli:main'

[dependency-groups]
dev = [
    'pytest>=8.0',
    'pytest-asyncio>=0.23',
    'ruff>=0.6',
    'mypy>=1.10',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/butter_agent']

[tool.ruff]
line-length = 320
target-version = 'py312'
src = ['src', 'tests']

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'SIM', 'RUF']
ignore = []

[tool.ruff.lint.isort]
known-first-party = ['butter_agent']

[tool.mypy]
python_version = '3.12'
strict = true
files = ['src', 'tests']
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ['tests']
# `-m "not live"` excludes the live-Ollama integration suite by default.
# Run it explicitly with `uv run pytest -m live` against your homelab.
addopts = '-ra --strict-markers -m "not live"'
asyncio_mode = 'auto'
markers = [
    'live: integration tests that hit a live Ollama instance — excluded from the default run',
]
